<canvas id="c"></canvas>
<div id="ui"><button id="run">Pause</button><button id="step">Step</button>
<label>Switching <input id="speed" type="range" min="1" max="40" value="6"></label><span id="ro"></span></div>
<style>
#c{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:10px;align-items:center;font:600 13px -apple-system,sans-serif}
button{font:inherit;border:1px solid #e0e0de;background:#f4f4f3;color:#0b0b0c;border-radius:999px;padding:6px 14px}
button:active{background:#0b0b0c;color:#ffffff}
label{display:flex;gap:8px;align-items:center;color:#66666b}
input{width:140px;accent-color:#0b0b0c}
#ro{margin-left:auto;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:1px;color:#0b0b0c}
</style>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,dpr=devicePixelRatio||1;
function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
// Six stator coils; the ESC energises opposite pairs in six steps.
let step=0,angle=0,vel=0,running=true,acc=0,turns=0,last=performance.now(),rpmT=0,rpm=0,prevA=0;
const ro=document.getElementById('ro'),sp=document.getElementById('speed');
document.getElementById('run').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Run'};
document.getElementById('step').onclick=()=>{running=false;document.getElementById('run').textContent='Run';step=(step+1)%6};
function target(){return step*Math.PI/3}
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  if(running){acc+=dt*sp.value;while(acc>=1){acc-=1;step=(step+1)%6}}
  // The rotor's north pole is pulled toward the energised coil (a spring with damping).
  let d=target()-angle;d=Math.atan2(Math.sin(d),Math.cos(d));
  vel+=(d*60-vel*9)*dt;angle+=vel*dt;
  rpmT+=dt;if(rpmT>0.5){rpm=Math.abs((angle-prevA)/rpmT)/(2*Math.PI)*60;prevA=angle;rpmT=0}
  draw();requestAnimationFrame(frame)}
function draw(){
  x.clearRect(0,0,W,H);
  const cx=W/2,cy=(H-44)/2,R=Math.min(W,H-44)/2-14;if(R<20)return;
  x.lineWidth=R*0.06;x.strokeStyle='#c6c6ca';x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3,on=i===step||i===(step+3)%6,north=i===step;
    x.save();x.translate(cx,cy);x.rotate(a);
    x.fillStyle=on?(north?'#0b0b0c':'#e8590c'):'#f4f4f3';x.strokeStyle=on?'#0b0b0c':'#c6c6ca';x.lineWidth=1.5;
    const r0=R*0.56,r1=R*0.86,w=R*0.26;
    x.beginPath();x.roundRect(r0,-w/2,r1-r0,w,6);x.fill();x.stroke();
    x.strokeStyle=on?'#ffffff':'#c6c6ca';x.lineWidth=1;
    for(let k=1;k<5;k++){const xx=r0+(r1-r0)*k/5;x.beginPath();x.moveTo(xx,-w/2+4);x.lineTo(xx,w/2-4);x.stroke()}
    x.fillStyle=on?'#ffffff':'#66666b';x.font='600 11px ui-monospace,Menlo,monospace';x.textAlign='center';x.textBaseline='middle';
    x.translate((r0+r1)/2,0);x.rotate(-a);x.fillText(on?(north?'S':'N'):'ABC'[i%3],0,0);
    x.restore()}
  // Rotor: a disc with a north (orange) and south (ink) magnet.
  x.save();x.translate(cx,cy);x.rotate(angle);
  x.fillStyle='#ffffff';x.strokeStyle='#0b0b0c';x.lineWidth=1.5;x.beginPath();x.arc(0,0,R*0.46,0,7);x.fill();x.stroke();
  x.fillStyle='#e8590c';x.beginPath();x.moveTo(0,0);x.arc(0,0,R*0.42,Math.PI*0.75,Math.PI*1.25);x.fill();
  x.fillStyle='#0b0b0c';x.beginPath();x.moveTo(0,0);x.arc(0,0,R*0.42,-Math.PI*0.25,Math.PI*0.25);x.fill();
  x.fillStyle='#ffffff';x.strokeStyle='#0b0b0c';x.beginPath();x.arc(0,0,R*0.12,0,7);x.fill();x.stroke();
  x.restore();
  ro.textContent='STEP '+(step+1)+'/6 · '+Math.round(rpm)+' RPM';
}
requestAnimationFrame(frame);
</script>
